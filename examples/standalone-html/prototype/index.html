<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Standalone Design Tool fixture</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="prototype-shell">
      <p class="eyebrow">Framework-free prototype</p>
      <h1 id="hero-title">A raw HTML surface</h1>

      <section id="runtime-host" aria-label="Runtime examples">
        <h2>Created later</h2>
      </section>
    </main>
    <script src="/prototype.js"></script>
    <!-- The host inserts Design Tool's mount and client after this source. -->
  </body>

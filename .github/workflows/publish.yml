name: Stage npm packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: npm-stage-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify and package release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Validate release tag
        run: pnpm run release:validate -- "$RELEASE_TAG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run required unit tests
        run: pnpm run test:unit

      - name: Verify package archives
        run: node scripts/verify-packages.mjs --output-directory .release-packages

      - name: Upload verified package archives
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages-${{ env.RELEASE_TAG }}
          path: .release-packages/*.tgz
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  stage:
    name: Stage ${{ matrix.name }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "@nudge-ui/agent-protocol"
            archive: nudge-ui-agent-protocol
          - name: "@nudge-ui/compiler"
            archive: nudge-ui-compiler
          - name: "create-nudge-ui"
            archive: create-nudge-ui
          - name: "@nudge-ui/css"
            archive: nudge-ui-css
          - name: "@nudge-ui/inspector"
            archive: nudge-ui-inspector
          - name: "@nudge-ui/vite-react"
            archive: nudge-ui-vite-react
          - name: "@nudge-ui/astro"
            archive: nudge-ui-astro
          - name: "@nudge-ui/nextjs"
            archive: nudge-ui-nextjs
          - name: "@nudge-ui/standalone"
            archive: nudge-ui-standalone
          - name: "@nudge-ui/mcp"
            archive: nudge-ui-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified package archives
        uses: actions/download-artifact@v5
        with:
          name: npm-packages-${{ env.RELEASE_TAG }}
          path: .release-packages

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with staged publishing support
        run: npm install --global npm@11.19.1

      - name: Stage package on npm
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"

          if npm view "${{ matrix.name }}@${version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${{ matrix.name }}@${version} is already published; skipping."
            exit 0
          fi

          npm stage publish ".release-packages/${{ matrix.archive }}-${version}.tgz" \
            --registry=https://registry.npmjs.org

  approval-instructions:
    name: Await npm approval
    needs: stage
    runs-on: ubuntu-latest
    steps:
      - name: Write approval instructions
        run: |
          echo "### $RELEASE_TAG is staged on npm" >> "$GITHUB_STEP_SUMMARY"
          echo "Review all ten packages in npm's Staged Packages page, then approve them with 2FA." >> "$GITHUB_STEP_SUMMARY"

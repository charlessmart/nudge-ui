name: Publish packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package archives
        run: pnpm run package:verify

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run full test suite
        run: pnpm run test:full

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish public packages
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            agent-protocol
            css
            inspector
            plugin
            astro
            nextjs
            standalone
            mcp
          )

          for directory in "${packages[@]}"; do
            package_name="$(node -p "require('./packages/${directory}/package.json').name")"
            package_version="$(node -p "require('./packages/${directory}/package.json').version")"

            if npm view "${package_name}@${package_version}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              echo "${package_name}@${package_version} is already published; skipping."
              continue
            fi

            echo "Publishing ${package_name}@${package_version}..."
            (
              cd "packages/${directory}"
              npm publish --access public
            )
          done
